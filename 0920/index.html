<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SpeakWise | 초개인화 영어 회화 챗봇</title>
  <style>
    :root{--bg:#f5f7fb;--panel:#fff;--ink:#172033;--muted:#697386;--line:#e5e9f2;--brand:#365cf5;--brand2:#edf1ff;--ok:#087443;--warn:#a45a00}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .app{max-width:1180px;margin:auto;padding:28px 18px 48px}.hero{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:22px}
    h1,h2,h3,p{margin:0} h1{font-size:30px;letter-spacing:-.04em}.subtitle{color:var(--muted);margin-top:5px}.badge{display:inline-flex;align-items:center;gap:7px;background:#eaf8f0;color:var(--ok);border-radius:99px;padding:7px 12px;font-weight:700;font-size:12px}
    .layout{display:grid;grid-template-columns:330px 1fr;gap:18px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 30px #22345b0a}.side{padding:18px;height:max-content}.side h2{font-size:16px;margin-bottom:14px}
    label{display:block;color:var(--muted);font-size:12px;font-weight:700;margin:13px 0 6px}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 11px;background:#fff;color:var(--ink);font:inherit}textarea{resize:vertical;min-height:80px}
    button{border:0;border-radius:10px;padding:10px 13px;font:inherit;font-weight:700;cursor:pointer}button.primary{background:var(--brand);color:#fff}button.secondary{background:var(--brand2);color:var(--brand)}button.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}button:disabled{opacity:.5;cursor:not-allowed}
    .actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}.hint{color:var(--muted);font-size:12px;margin-top:10px}.status{border-top:1px solid var(--line);margin-top:18px;padding-top:15px}
    .level{display:flex;align-items:center;justify-content:space-between}.level strong{font-size:32px;color:var(--brand)}.meter{height:8px;border-radius:99px;background:#edf0f6;overflow:hidden;margin:8px 0}.meter i{display:block;height:100%;background:var(--brand);width:0%;transition:.3s}.small{font-size:12px;color:var(--muted)}
    .main{min-height:650px;display:flex;flex-direction:column;overflow:hidden}.tabs{display:flex;border-bottom:1px solid var(--line);padding:0 16px}.tab{background:none;color:var(--muted);border-radius:0;padding:14px 15px;border-bottom:2px solid transparent}.tab.active{color:var(--brand);border-color:var(--brand)}.view{display:none}.view.active{display:flex;flex:1;flex-direction:column}
    .chat{padding:18px;overflow:auto;min-height:470px;max-height:610px}.msg{display:flex;margin:12px 0}.msg.user{justify-content:flex-end}.bubble{max-width:78%;padding:12px 14px;border-radius:14px;background:#f0f3f9;white-space:pre-wrap}.user .bubble{background:var(--brand);color:#fff;border-bottom-right-radius:4px}.bot .bubble{border-bottom-left-radius:4px}.meta{font-size:11px;color:var(--muted);margin:0 4px 4px}.user .meta{text-align:right}.empty{text-align:center;color:var(--muted);padding:100px 20px}.composer{border-top:1px solid var(--line);padding:14px;display:flex;gap:9px}.composer textarea{min-height:48px;max-height:130px}.composer button{align-self:flex-end}
    .examples{padding:20px}.example{border:1px solid var(--line);border-radius:12px;padding:15px;margin-bottom:12px}.example h3{font-size:15px;margin-bottom:8px}.example p{color:var(--muted);white-space:pre-wrap;font-size:13px}
    .prompt{padding:20px}.prompt pre{white-space:pre-wrap;background:#111827;color:#e5e7eb;border-radius:12px;padding:16px;max-height:560px;overflow:auto;font:12px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace}
    .notice{background:#fff8e8;color:var(--warn);border:1px solid #f2dfad;padding:10px 12px;border-radius:10px;font-size:12px;margin-top:12px}
    @media(max-width:800px){.layout{grid-template-columns:1fr}.side{order:2}.main{min-height:620px}.hero{display:block}.badge{margin-top:12px}}
  </style>
</head>
<body>
<main class="app">
  <header class="hero">
    <div><h1>SpeakWise</h1><p class="subtitle">나에게 맞춰 대화하고, 근거와 함께 성장하는 영어 회화 연습</p></div>
    <span class="badge">● Part 1 구현본 · Text conversation</span>
  </header>
  <section class="layout">
    <aside class="panel side">
      <h2>학습자 프로필</h2>
      <label for="name">이름 또는 닉네임</label><input id="name" value="Learner">
      <label for="goal">학습 목표</label><input id="goal" value="여행에서 자연스럽게 대화하기">
      <label for="interest">관심 주제</label><input id="interest" value="travel, food, daily life">
      <label for="levelSelect">시작 예상 수준</label>
      <select id="levelSelect"><option>A1</option><option>A2</option><option selected>B1</option><option>B2</option><option>C1</option><option>C2</option></select>
      <label for="endpoint">API endpoint (OpenAI 호환)</label><input id="endpoint" value="https://api.openai.com/v1/chat/completions">
      <label for="model">Model</label><input id="model" value="gpt-4o-mini">
      <label for="apiKey">API key (브라우저에만 임시 저장)</label><input id="apiKey" type="password" placeholder="sk-...">
      <div class="actions"><button class="primary" id="start">연습 시작</button><button class="ghost" id="end" disabled>연습 종료</button></div>
      <p class="hint">API key 없이도 예시 대화와 프롬프트를 확인할 수 있습니다. 실제 대화는 OpenAI 호환 API가 필요합니다.</p>
      <div class="status"><div class="level"><span class="small">현재 평가</span><strong id="level">—</strong></div><div class="meter"><i id="meter"></i></div><p class="small" id="assessment">아직 평가하지 않았습니다.</p></div>
    </aside>
    <section class="panel main">
      <nav class="tabs"><button class="tab active" data-view="chatView">회화 연습</button><button class="tab" data-view="examplesView">제출용 예시 3개</button><button class="tab" data-view="promptView">개발 프롬프트</button></nav>
      <div id="chatView" class="view active"><div class="chat" id="chat"><div class="empty">프로필을 확인한 뒤 <b>연습 시작</b>을 눌러 주세요.<br>영어로 답하면 수준에 맞춰 다음 질문과 피드백을 제공합니다.</div></div><div class="composer"><textarea id="input" placeholder="영어로 답변을 입력하세요..." disabled></textarea><button class="primary" id="send" disabled>보내기</button></div></div>
      <div id="examplesView" class="view"><div class="examples" id="examples"></div></div>
      <div id="promptView" class="view"><div class="prompt"><h2>Part 1 제출용 시스템 프롬프트</h2><p class="small" style="margin:6px 0 12px">이 프롬프트는 앱이 API에 보내는 핵심 지시문입니다.</p><pre id="promptText"></pre><button class="secondary" id="copyPrompt">프롬프트 복사</button></div></div>
    </section>
  </section>
</main>
<script>
const levels=["A1","A2","B1","B2","C1","C2"], score={A1:1,A2:2,B1:3,B2:4,C1:5,C2:6};
let messages=[], active=false, turns=0, currentLevel="";
const $=id=>document.getElementById(id);
const promptTemplate=()=>`You are SpeakWise, a hyper-personalized English conversation tutor.
Learner profile: name=${$("name").value}; goal=${$("goal").value}; interests=${$("interest").value}; starting estimate=${$("levelSelect").value}.

RULES
1. Conversation is text-based and your learner-facing conversation is in English. Ask one natural follow-up question every turn.
2. Adapt vocabulary, sentence length, grammar and topic difficulty to the learner's demonstrated CEFR level.
3. Reassess after every 3 learner turns (or sooner when strong evidence appears). Choose exactly one CEFR code: A1, A2, B1, B2, C1, or C2. Never invent a code.
4. If the new level differs from the previous level, explicitly write: "LEVEL CHANGE: previous X -> new Y" and give one evidence-based reason.
5. Give concise, specific feedback after each learner message: (a) one correction, (b) a more natural alternative, and (c) one useful expression. Do not interrupt fluency with excessive corrections.
6. Keep a private evidence log of grammar control, vocabulary range, fluency/coherence, comprehensibility and interaction. Do not claim listening or pronunciation evidence from text.
7. On START, introduce the activity and ask an easy question. On END, provide final CEFR, evidence, 2 strengths, 2 priorities, and a 3-step practice plan.

OUTPUT FORMAT
Reply: <natural English response and one follow-up question>
Feedback: <specific correction / natural alternative / useful expression>
Assessment: <show only every 3 turns or when changed: CEFR: X — brief evidence>
Always be encouraging, honest, concise, and personalized.`;
$("promptText").textContent=promptTemplate();
function add(role,text){const wrap=document.createElement("div");wrap.className=`msg ${role}`;wrap.innerHTML=`<div><div class="meta">${role==="user"?"You":"SpeakWise"}</div><div class="bubble"></div></div>`;wrap.querySelector(".bubble").textContent=text;$("chat").append(wrap);$("chat").scrollTop=$("chat").scrollHeight}
function setLevel(level,reason){if(!levels.includes(level))return;const old=currentLevel;currentLevel=level;$("level").textContent=level;$("meter").style.width=`${score[level]/6*100}%`;$("assessment").textContent=reason||"현재 대화 증거를 바탕으로 평가했습니다.";if(old&&old!==level)add("bot",`LEVEL CHANGE: ${old} → ${level}\nEvidence: ${reason||"Your recent response showed a different level of control."}`)}
function localReply(text){turns++;const words=text.trim().split(/\s+/).length;let inferred=words<7?"A1":words<14?"A2":words<26?"B1":words<42?"B2":"C1";if(turns===1) inferred=$("levelSelect").value;const reason=`Your response used ${words} words and showed ${words>20?"connected ideas":"short, familiar sentences"}.`;let correction="Try adding one detail to make your answer clearer.";if(/\bi am agree\b/i.test(text)) correction='Say “I agree” rather than “I am agree.”';else if(/\bhe go\b/i.test(text)) correction='Say “He goes” for third-person singular present tense.';setLevel(inferred,reason);return`Thanks for sharing that. Tell me one more detail about it.\n\nFeedback: ${correction}\nMore natural: “I would like to talk more about it.”\nUseful expression: “One reason is that …”\n\n${turns%3===0?`Assessment: CEFR: ${inferred} — ${reason}`:""}`.trim()}
async function send(){const text=$("input").value.trim();if(!text||!active)return;add("user",text);messages.push({role:"user",content:text});$("input").value="";$("send").disabled=true;try{const key=$("apiKey").value.trim();if(!key){add("bot",localReply(text));return}const res=await fetch($("endpoint").value.trim(),{method:"POST",headers:{"Content-Type":"application/json","Authorization":`Bearer ${key}`},body:JSON.stringify({model:$("model").value.trim(),temperature:.4,messages:[{role:"system",content:promptTemplate()},...messages]})});if(!res.ok)throw new Error(`API ${res.status}: ${await res.text()}`);const data=await res.json(),reply=data.choices?.[0]?.message?.content;if(!reply)throw new Error("API 응답에 message.content가 없습니다.");messages.push({role:"assistant",content:reply});add("bot",reply);const found=reply.match(/\b(A1|A2|B1|B2|C1|C2)\b/);if(found)setLevel(found[1],"The tutor's latest assessment is based on your recent text evidence.");}catch(err){add("bot",`연결 오류: ${err.message}\nAPI endpoint와 key를 확인하거나 key 없이 데모 모드로 다시 시도하세요.`)}finally{$("send").disabled=false;$("input").focus()}}
function start(){active=true;turns=0;messages=[];currentLevel="";$("chat").innerHTML="";$("start").disabled=true;$("end").disabled=false;$("input").disabled=false;$("send").disabled=false;$("promptText").textContent=promptTemplate();add("bot",`Hi ${$("name").value}! I’m SpeakWise. We’ll practice ${$("goal").value}. Let’s begin: what is one recent experience related to ${$("interest").value}?`)}
function end(){if(!active)return;active=false;$("start").disabled=false;$("end").disabled=true;$("input").disabled=true;$("send").disabled=true;add("bot",`Session complete.\n\nFinal assessment: CEFR: ${currentLevel||$("levelSelect").value}\nStrengths: You kept the conversation going and shared personal meaning.\nPriorities: Add specific details and review one recurring grammar pattern.\nPractice plan: 1) answer one question for 60 seconds, 2) rewrite it with two connectors, 3) reuse one new expression tomorrow.`)}
$("start").onclick=start;$("end").onclick=end;$("send").onclick=send;$("input").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send()}});
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tab,.view").forEach(x=>x.classList.remove("active"));b.classList.add("active");$(b.dataset.view).classList.add("active")});
$("copyPrompt").onclick=()=>navigator.clipboard.writeText(promptTemplate()).then(()=>$("copyPrompt").textContent="복사 완료");
$("examples").innerHTML=`<div class="example"><h3>대화 1 · A1 Basic User</h3><p>Student: My name is Mina. I live in Seoul. I like coffee.\nSpeakWise: Nice to meet you, Mina! What coffee do you like?\nFeedback: “I like coffee” is correct. You can add “I usually drink …” to give more information.\nAssessment: CEFR: A1 — short, familiar sentences with basic personal information.</p></div><div class="example"><h3>대화 2 · A2 → B1 Level Change</h3><p>Student: I went to Busan last weekend. The beach was beautiful and I eat seafood.\nSpeakWise: That sounds fun. What did you do after eating seafood?\nFeedback: Say “I ate seafood” because the trip was in the past. More natural: “After lunch, we walked along the beach.”\nAssessment: CEFR: A2 — understandable past events with one tense error.\nStudent: After lunch, we walked along the beach, although it was raining, because we wanted to see the sunset.\nSpeakWise: That is a clear, connected answer. What would you recommend to a friend visiting Busan?\nFeedback: Excellent use of “although” and “because.” Useful expression: “I would highly recommend …”\nLEVEL CHANGE: A2 → B1\nEvidence: You connected ideas with appropriate linking words and explained a recommendation.</p></div><div class="example"><h3>대화 3 · B2 Independent User</h3><p>Student: Remote work can improve productivity, but its impact depends on how organizations structure communication and accountability.\nSpeakWise: What policy would you introduce to preserve flexibility without weakening collaboration?\nFeedback: Your contrast and abstract vocabulary are effective. More natural: “The impact depends on how communication and accountability are structured.”\nAssessment: CEFR: B2 — sustained, nuanced argument with clear organization and precise vocabulary.</p></div>`;
</script>
</body>
</html>
